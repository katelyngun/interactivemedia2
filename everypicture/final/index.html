<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Every Picture</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>



  <div class="closet-wrapper" id="closetWrapper">
    <img
      src="everypicture/closet.png"
      alt="My Closet"
      id="closetImg"

    />
  </div>




  <div class="overlay" id="overlay">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>

    <div class="popup" id="popup">
      <button class="popup-close" id="popupClose" aria-label="Close">✕</button>

      <div class="popup-image">
        <img id="popupImg" src="" alt=""/>
        <p class="popup-image-placeholder" id="popupImgPlaceholder">photo </p>
      </div>

      <h2 id="popupTitle">Item Name</h2>
      <p id="popupDesc">Description .</p>
    </div>
  </div>

  <script src="script.js" defer ></script>
</body>
</html>
